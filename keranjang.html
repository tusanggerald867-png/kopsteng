<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Periksa dan atur pesananmu di keranjang Kopsteng.">
  <meta name="theme-color" content="#0e0906">
  <title>Kopsteng | Keranjang</title>
  <script>
    (function () {
      var h = document.documentElement;
      h.classList.add("js-motion");
      try {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        if (sessionStorage.getItem("ks-nav")) { h.classList.add("is-arriving"); sessionStorage.removeItem("ks-nav"); }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body data-page="cart">
  <div class="curtain" aria-hidden="true"><div class="curtain__inner"><span class="logo-badge"><img src="foto kopsteng/logo.webp" alt="" width="512" height="512"></span><span class="curtain__word">Kopsteng</span></div></div>
  <div id="site-header"></div>
  <main id="konten">
    <section class="page-hero">
      <div class="shell">
        <p class="kicker" data-hero-anim data-hero-fade><b>(Keranjang)</b> Pesananmu</p>
        <h1 class="page-hero__title" data-hero-anim data-split-hero>Keranjang <em>belanja</em></h1>
        <div class="page-hero__row" data-hero-anim data-hero-fade>
          <p class="page-hero__lead">Atur jumlah pesanan, lalu lanjutkan ke checkout.</p>
        </div>
      </div>
    </section>
    <div class="page-body">
      <div class="shell">
        <div id="cart-content"></div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
